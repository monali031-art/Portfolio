< html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>
    <form action="success.html" method="get">
        <table align="center" width="700" cellpadding="10">
            <tr>
                <td align="center">
                <h1>Registration Form</h1>
                </td>
            </tr>
            <tr>
                <td>
                    Name:
                </td>
                <td>
                    <label for="input-name">
                        <input type="Name" name="text-name" id="Full-name">
                    </label>
                </td>
            </tr>
            <tr>
                <td>
                    Email-id:
                </td>
                <td>
                    <label for="input-name">
                        <input type="email" name="email" id="EmailId">
                    </label>
                </td>
            </tr>
            <tr>
                <td>
                    Phone-no:
                </td>
                <td>
                    <label for="input-name">
                        <select>
                            <option>+91</option>
                            <option>+97</option>
                            <option>+98</option>
                            <option>+90</option>
                            <option>+99</option>
                        </select>
                        <input type="tel" name="phone" id="Phone No" >
                    </label>
                </td>
            </tr>
            <tr>
                <td>
                    Gender:
                </td>
                <td>
                    <input type="radio" name="Gender" id="Male">Male
                    <input type="radio" name="Gender" id="Female">Female
                    <input type="radio" name="Gender" id="Others">Others
                </td>
            </tr>
            <tr>
                <td>
                    Course:
                </td>
                <td>
                    <Select>
                        <option>Master Degree</option>
                        <option>MCA</option>
                        <option>MBA</option>
                        <option>M.TECH</option>
                        <option>MSC</option>
                        <option>MA</option>
                        <option>M.com</option>
                </td>
            </tr>
            <tr>
                <td>
                    Terms&Conditions:
                </td>
                <td>
                    <label for="input-name">
                        <p>
                            By registering our platform,you agree to our Terms of Service and acknowledge
                            that you have read and understood our Privacy Policy.
                        </p>
                        <input type="checkbox" id="terms" class="Check">
                        <label for="terms">I agree to all Terms & Conditions</label>
                    </label>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
